<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1, h2 {
            color: #222;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button, .button {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .save {
            background: #198754;
            margin-top: 20px;
        }

        .edit {
            background: #0d6efd;
        }

        .delete {
            background: #dc3545;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #212529;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .success-message {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .error-message {
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Employee Management System</h1>
    <p>Add, view, edit and delete employee records.</p>

    <div th:if="${successMessage}" class="success-message"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="error-message"
         th:text="${errorMessage}"></div>

    <section class="card">
        <h2>Register New Employee</h2>

        <form th:action="@{/employees}"
              th:object="${employee}"
              method="post">

            <div class="form-grid">

                <div class="field">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"
                           th:field="*{fullName}">
                    <span class="error"
                          th:if="${#fields.hasErrors('fullName')}"
                          th:errors="*{fullName}"></span>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           th:field="*{email}">
                    <span class="error"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"></span>
                </div>

                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone"
                           th:field="*{phone}"
                           inputmode="numeric" maxlength="10">
                    <span class="error"
                          th:if="${#fields.hasErrors('phone')}"
                          th:errors="*{phone}"></span>
                </div>

                <div class="field">
                    <label for="department">Department</label>
                    <input type="text" id="department"
                           th:field="*{department}">
                    <span class="error"
                          th:if="${#fields.hasErrors('department')}"
                          th:errors="*{department}"></span>
                </div>

                <div class="field">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary"
                           th:field="*{salary}"
                           min="0.01" step="0.01">
                    <span class="error"
                          th:if="${#fields.hasErrors('salary')}"
                          th:errors="*{salary}"></span>
                </div>

            </div>

            <button type="submit" class="save">Save Employee</button>
        </form>
    </section>

    <section class="card">
        <h2>Employee Records</h2>

        <p>
            Total employees:
            <strong th:text="${#lists.size(employees)}">0</strong>
        </p>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.salary}"></td>

                    <td>
                        <div class="actions">
                            <a class="button edit"
                               th:href="@{/employees/{id}/edit(id=${emp.id})}">
                                Edit
                            </a>

                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this employee?');">
                                <button type="submit" class="delete">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" style="text-align: center;">
                        No employees found. Add your first employee above.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
</body>
</html>
